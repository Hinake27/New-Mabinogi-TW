<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>新瑪奇計算器</title>
  <style>
    /* ========== 基礎設定 ========== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color .3s, color .3s, border-color .3s, transform .2s ease;
    }

    :root{
      /* 秋季主色盤 */
      --bg: #fff8f0;                 /* 米白底 */
      --bg-accent: #ffedd8;          /* 米杏點綴 */
      --ink: #47372a;                /* 墨咖啡字色 */
      --muted: #7c6a58;              /* 次要字色 */
      --primary: #d2691e;            /* 深楓葉橘 */
      --primary-2: #ff9a3d;          /* 亮橙 */
      --primary-3: #a0522d;          /* 深棕 */
      --ring: rgba(210,105,30,.25);  /* 焦點外光暈 */
      --card: #ffffff;               /* 卡片 */
      --input: #ecd8c7;              /* 輕描邊框 */
      --soft: #f7e7d6;               /* 區塊底 */
      --shadow: 0 10px 35px rgba(160, 82, 45,.10);
      --radius: 14px;
    }

    /* 深色模式（也做成秋色系） */
    .dark-mode{
      --bg: #1b1613;
      --bg-accent: #221b16;
      --ink: #f2e9e1;
      --muted: #c7b6a6;
      --primary: #ff9a3d;
      --primary-2: #ffd39a;
      --primary-3: #e37b2f;
      --card: #2a221d;
      --input: #3a2f28;
      --soft: #342a24;
      --ring: rgba(255,154,61,.25);
      --shadow: 0 10px 35px rgba(0,0,0,.35);
    }

    html, body{
      height: 100%;
      font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, var(--bg-accent), transparent 70%),
        radial-gradient(1000px 500px at 110% 10%, var(--bg-accent), transparent 70%),
        var(--bg);
      line-height: 1.65;
      padding: 28px;
      overflow-x: hidden;
    }

    /* ========== 秋葉飄落（背景演出，低干擾） ========== */
    .leaf-layer{
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.0), rgba(0,0,0,.15) 10%, rgba(0,0,0,.6) 40%, rgba(0,0,0,.9));
    }

    .leaf{
      position: absolute;
      top: -8vh;
      font-size: clamp(10px, 2.2vw, 20px);
      filter: drop-shadow(0 4px 6px rgba(0,0,0,.15));
      opacity: .8;
      animation: fall linear var(--dur) var(--delay) infinite;
    }

    /* 使用三種顏色小圓片（CSS 繪製）避免表情符號風格差異 */
    .leaf::before{
      content: "";
      display: block;
      width: 1em;
      height: .85em;
      border-radius: 60% 60% 60% 0;
      background: var(--leaf-color, #d2691e);
      transform: rotate(var(--rot, -20deg));
    }

    @keyframes fall{
      0%{
        transform: translate3d(var(--x, 0vw), -10vh, 0) rotate(0deg);
      }
      50%{
        transform: translate3d(calc(var(--x, 0vw) + 6vw), 50vh, 0) rotate(180deg);
      }
      100%{
        transform: translate3d(calc(var(--x, 0vw) - 4vw), 110vh, 0) rotate(360deg);
      }
    }

    /* ========== 容器與區塊 ========== */
    .container{
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      background: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.9)) , var(--card);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(160,82,45,.12);
      border-radius: calc(var(--radius) + 6px);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .header{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    h1{
      font-size: clamp(22px, 2.4vw, 28px);
      letter-spacing: .5px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* ========== 機制元件 ========== */
    .switch{
      position: relative;
      width: 64px; height: 34px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--soft), var(--input));
      box-shadow: inset 0 2px 6px rgba(0,0,0,.06);
      cursor: pointer;
    }
    .switch input{ opacity: 0; width: 0; height: 0; }
    .slider{
      position: absolute; inset: 4px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--bg), var(--soft));
    }
    .slider::before{
      content:"";
      position: absolute; left: 3px; top: 3px;
      width: 24px; height: 24px; border-radius: 50%;
      background: linear-gradient(180deg, #fff, #f5ede6);
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      transition: transform .35s cubic-bezier(.22,1,.36,1);
    }
    input:checked + .slider::before{ transform: translateX(26px); }
    .theme-switch{ display:flex; align-items:center; gap:10px; color:var(--muted); font-size:14px; }

    /* ========== Tabs ========== */
    .tabs{
      display:flex; gap:10px; margin-bottom: 18px;
      background: linear-gradient(180deg, rgba(255,154,61,.08), transparent 60%);
      padding: 8px;
      border-radius: calc(var(--radius) + 2px);
    }
    .tab{
      flex:1;
      border: 1px solid transparent;
      background: linear-gradient(180deg, #fff, #fff6ee);
      color: var(--ink);
      padding: 10px 16px;
      border-radius: var(--radius);
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(210,105,30,.10);
      transform: translateY(0);
    }
    .tab:hover{ transform: translateY(-1px); }
    .tab.active{
      color: #fff;
      background: linear-gradient(180deg, var(--primary), var(--primary-3));
      box-shadow: 0 8px 20px rgba(210,105,30,.25);
    }

    /* ========== 內容區 ========== */
    .calculator{ display:none; }
    .calculator.active{ display:block; animation: fadeInUp .35s ease both; }
    @keyframes fadeInUp{
      from{ opacity:0; transform: translateY(6px); }
      to{ opacity:1; transform: translateY(0); }
    }

    h2{
      font-size: 18px; margin-bottom: 14px; font-weight: 700;
      color: var(--ink);
    }

    .input-group{ margin-bottom: 14px; }
    label{ display:block; margin-bottom:6px; color:var(--muted); font-size: 14px; }

    input[type="number"], select{
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--input);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font-size: 16px;
      outline: none;
      box-shadow: 0 2px 0 #00000003;
    }
    input[type="number"]:focus, select:focus{
      border-color: var(--primary);
      box-shadow: 0 0 0 6px var(--ring);
    }

    .option-switch,
    .converter-toggle,
    .format-toggle{ margin: 10px 0 14px; color: var(--muted); }

    .converter-inputs{
      display:flex; gap:10px; align-items: stretch;
    }
    .converter-row{ flex:1; }

    .swap-btn{
      margin-top: 24px;
      width: 44px; height: 44px; flex-shrink:0;
      border-radius: 12px;
      border: 1px solid var(--input);
      background: linear-gradient(180deg, #fff, #fff6ee);
      font-size: 18px; cursor:pointer;
    }
    .swap-btn:hover{ transform: rotate(90deg); }

    button.action{
      background: linear-gradient(180deg, var(--primary-2), var(--primary));
      color: #fff;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      box-shadow: 0 8px 18px rgba(210,105,30,.25);
      margin-top: 4px;
    }
    button.action:hover{ transform: translateY(-1px) scale(1.01); }
    button.action:active{ transform: translateY(0) scale(.995); }

    .result{
      padding: 16px 14px;
      background: linear-gradient(180deg, #fff, var(--soft));
      border-radius: 12px;
      border-left: 4px solid var(--primary);
      box-shadow: 0 6px 18px rgba(210,105,30,.10);
      margin-top: 12px;
      font-size: 16px;
      color: var(--ink);
      display:none;
      white-space: pre-line;
      animation: fadeInUp .35s ease both;
    }

    .notice{
      margin-top: 14px;
      padding: 12px 14px;
      background: linear-gradient(180deg, var(--bg-accent), transparent 60%);
      border: 1px dashed rgba(210,105,30,.25);
      border-radius: 12px;
      font-size: 13px; color: var(--muted);
    }

    .formula{ color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .result-value{
      color: var(--primary);
      font-weight: 900;
      letter-spacing: .4px;
    }

    .section{
      margin-bottom: 14px;
      padding: 14px;
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--input);
    }
    .section h2{ margin-bottom:8px; }

    .chinese-format{
      color: var(--primary);
      font-weight: 800;
      padding: 6px 2px;
      letter-spacing: .4px;
      display:none;
      animation: fadeInUp .35s ease both;
    }

    /* 行動裝置 */
    @media (max-width: 520px){
      body{ padding: 18px; }
      .converter-inputs{ flex-direction: column; }
      .swap-btn{ width: 100%; height: 40px; margin: 0 0 4px; }
    }
  </style>
</head>
<body>
  <!-- 背景秋葉 -->
  <div class="leaf-layer" aria-hidden="true" id="leafLayer"></div>

  <div class="container">
    <div class="header">
      <h1>新瑪奇計算器</h1>
      <div class="theme-switch">
        <span>暗色模式</span>
        <label class="switch">
          <input type="checkbox" id="darkModeToggle" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab(event,'currency')">遊戲幣計算器</button>
      <button class="tab" onclick="switchTab(event,'bank')">銀行交易計算器</button>
      <button class="tab" onclick="switchTab(event,'auction')">拍賣手續費計算</button>
    </div>

    <!-- 遊戲幣計算器 -->
    <div id="currency" class="calculator active">
      <h2>新瑪奇遊戲幣計算器</h2>

      <div class="option-switch">
        <label>
          <input type="checkbox" id="customRateToggle" onchange="toggleCustomRate()"/>
          自定義匯率
        </label>
      </div>

      <div id="customRateInput" class="input-group" style="display:none;">
        <label>自定義匯率：</label>
        <input type="number" id="exchangeRate" value="160000" />
      </div>

      <div class="converter-toggle">
        <label>
          <input type="radio" name="convertDirection" value="twdToGame" checked onchange="updateConverterUI()"/>
          台幣轉遊戲幣
        </label>
        &emsp;
        <label>
          <input type="radio" name="convertDirection" value="gameToTwd" onchange="updateConverterUI()"/>
          遊戲幣轉台幣
        </label>
      </div>

      <div class="converter-inputs">
        <div class="converter-row">
          <div class="input-group">
            <label id="amountLabel">台幣金額：</label>
            <input type="number" id="amountInput" placeholder="請輸入金額" />
          </div>
        </div>
        <button class="swap-btn" onclick="swapConversion()" title="切換方向">⇄</button>
        <div class="converter-row">
          <div class="input-group">
            <label id="resultLabel">遊戲幣金額：</label>
            <input type="number" id="resultInput" placeholder="計算結果" readonly />
          </div>
        </div>
      </div>

      <button class="action" onclick="calculateCurrency()">計算匯率</button>
      <div id="currencyResult" class="result"></div>
      <div id="chineseFormatResult" class="chinese-format"></div>

      <div class="format-toggle">
        <label>
          <input type="checkbox" id="chineseFormatToggle" onchange="toggleChineseFormat()"/>
          顯示中文數字格式（萬／億／兆／京）
        </label>
      </div>

      <div class="notice">
        ‧ 預設匯率為 1 台幣 = 1,000,000 遊戲幣<br/>
        ‧ 自定義匯率預設值為 1 台幣 = 160,000 遊戲幣<br/>
        ‧ 中文數字格式使用「萬、億、兆、京」單位
      </div>
    </div>

    <!-- 銀行交易計算器 -->
    <div id="bank" class="calculator">
      <h2>新瑪奇銀行交易計算器</h2>

      <div class="input-group">
        <label>交易類型：</label>
        <select id="transactionType">
          <option value="cashDeposit">現金存入銀行</option>
          <option value="cashWithdraw">現金提取銀行</option>
          <option value="checkIssue">支票開立</option>
          <option value="checkDeposit">支票存入銀行</option>
        </select>
      </div>

      <div class="input-group">
        <label>交易金額（瑪幣）：</label>
        <input type="number" id="bankAmount" placeholder="請輸入金額" />
      </div>

      <div class="option-switch">
        <label>
          <input type="checkbox" id="wednesdayDiscount" />
          禮拜三折扣
        </label>
      </div>

      <button class="action" onclick="calculateBank()">計算交易</button>
      <div id="bankResult" class="result"></div>
      <div id="bankChineseResult" class="chinese-format"></div>

      <div class="format-toggle">
        <label>
          <input type="checkbox" id="bankChineseToggle" onchange="toggleBankChineseFormat()"/>
          顯示中文數字格式
        </label>
      </div>

      <div class="notice">
        ‧ 現金交易：提取無手續費，存入需扣 10%（週三 7.5%）<br/>
        ‧ 支票交易：開立需付 5% 手續費（週三 3.75%），存入無手續費
      </div>
    </div>

    <!-- 拍賣手續費計算器 -->
    <div id="auction" class="calculator">
      <h2>拍賣手續費計算器</h2>

      <div class="option-switch">
        <label>
          <input type="checkbox" id="includeCheckFee" />
          計算支票手續費
        </label>
      </div>

      <div class="input-group">
        <label>拍賣金額（瑪幣）：</label>
        <input type="number" id="auctionAmount" placeholder="請輸入金額" />
      </div>

      <button class="action" onclick="calculateAuctionFee()">計算手續費</button>
      <div id="auctionResult" class="result"></div>
      <div id="auctionChineseResult" class="chinese-format"></div>

      <div class="format-toggle">
        <label>
          <input type="checkbox" id="auctionChineseToggle" onchange="toggleAuctionChineseFormat()"/>
          顯示中文數字格式
        </label>
      </div>

      <div class="notice">
        ‧ 一般物品：拍賣手續費 5% / 支票手續費 5%<br/>
        ‧ 生活服務物品：拍賣手續費 4% / 支票手續費 4%<br/>
        ‧ 若同時使用支票，將依序扣除拍賣手續費與支票手續費
      </div>
    </div>
  </div>

  <script>
    /* ========== 秋葉生成（輕量、效能友善） ========== */
    (function genLeaves(){
      const layer = document.getElementById('leafLayer');
      const count = Math.min(22, Math.floor(window.innerWidth/60));
      const colors = ['#d2691e', '#ffb347', '#a0522d', '#e07a3f'];
      for(let i=0;i<count;i++){
        const s = document.createElement('span');
        s.className = 'leaf';
        const x = Math.random()*100;            // vw
        const dur = 12 + Math.random()*10;      // s
        const delay = -Math.random()*dur;       // 讓初始就分散
        const rot = (Math.random()*60-30)+'deg';
        const color = colors[i%colors.length];
        s.style.setProperty('--x', x+'vw');
        s.style.setProperty('--dur', dur+'s');
        s.style.setProperty('--delay', delay+'s');
        s.style.setProperty('--rot', rot);
        s.style.setProperty('--leaf-color', color);
        layer.appendChild(s);
      }
    })();

    /* ========== 主題（深／淺） ========== */
    function checkThemePreference(){
      const dark = localStorage.getItem('darkMode');
      if(dark === 'true'){
        document.body.classList.add('dark-mode');
        document.getElementById('darkModeToggle').checked = true;
      }
    }
    function toggleDarkMode(){
      const on = document.getElementById('darkModeToggle').checked;
      document.body.classList.toggle('dark-mode', on);
      localStorage.setItem('darkMode', on ? 'true' : 'false');
    }
    document.getElementById('darkModeToggle').addEventListener('change', toggleDarkMode);

    /* ========== Tabs ========== */
    function switchTab(ev, id){
      document.querySelectorAll('.calculator').forEach(c=>c.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      ev.currentTarget.classList.add('active');
    }

    /* ========== 工具：數字 => 中文單位 ========== */
    function formatNumberToChinese(num){
      if (!isFinite(num)) return '';
      if (num === 0) return '0';
      const units = ['', '萬', '億', '兆', '京'];
      const segments = [];
      let temp = Math.floor(Math.abs(num));
      for(let i=0;i<units.length;i++){
        const seg = temp % 10000;
        if(seg !== 0 || i === 0){
          let formatted = '';
          if(i === 0){
            formatted = seg === 0 ? '' : String(seg);
          }else{
            formatted = String(seg).padStart(4,'0');
            if(formatted !== '0000') formatted = String(parseInt(formatted,10));
          }
          if(formatted) segments.unshift(formatted + units[i]);
        }
        temp = Math.floor(temp/10000);
        if(temp === 0) break;
      }
      return (num < 0 ? '－' : '') + segments.join('');
    }

    /* ========== 遊戲幣計算器 ========== */
    function toggleCustomRate(){
      const box = document.getElementById('customRateInput');
      box.style.display = document.getElementById('customRateToggle').checked ? 'block' : 'none';
    }

    function updateConverterUI(){
      const dir = document.querySelector('input[name="convertDirection"]:checked').value;
      document.getElementById('amountLabel').textContent = (dir === 'twdToGame') ? '台幣金額：' : '遊戲幣金額：';
      document.getElementById('resultLabel').textContent = (dir === 'twdToGame') ? '遊戲幣金額：' : '台幣金額：';
      // reset
      document.getElementById('amountInput').value = '';
      document.getElementById('resultInput').value = '';
      document.getElementById('currencyResult').style.display = 'none';
      document.getElementById('chineseFormatResult').style.display = 'none';
    }

    function swapConversion(){
      const now = document.querySelector('input[name="convertDirection"]:checked').value;
      const next = now === 'twdToGame' ? 'gameToTwd' : 'twdToGame';
      document.querySelector(`input[name="convertDirection"][value="${next}"]`).checked = true;
      updateConverterUI();
    }

    function calculateCurrency(){
      const amount = parseFloat(document.getElementById('amountInput').value);
      const rate = document.getElementById('customRateToggle').checked
        ? parseFloat(document.getElementById('exchangeRate').value)
        : 1000000;
      const dir = document.querySelector('input[name="convertDirection"]:checked').value;

      if (isNaN(amount) || amount <= 0 || isNaN(rate) || rate <= 0) {
        alert('請輸入有效金額與匯率');
        return;
      }

      let out, text;
      if (dir === 'twdToGame'){
        out = Math.floor(amount * rate);
        text = `${amount.toLocaleString()} 台幣 = ${out.toLocaleString()} 遊戲幣`;
        document.getElementById('resultInput').value = out;
      }else{
        out = Math.floor((amount / rate) * 100) / 100;
        text = `${amount.toLocaleString()} 遊戲幣 = ${out.toLocaleString()} 台幣`;
        document.getElementById('resultInput').value = out;
      }
      const box = document.getElementById('currencyResult');
      box.textContent = text;
      box.style.display = 'block';

      if (document.getElementById('chineseFormatToggle').checked){
        updateChineseFormat();
        document.getElementById('chineseFormatResult').style.display = 'block';
      } else {
        document.getElementById('chineseFormatResult').style.display = 'none';
      }
    }

    function toggleChineseFormat(){
      const toggle = document.getElementById('chineseFormatToggle');
      const out = document.getElementById('resultInput').value;
      const el = document.getElementById('chineseFormatResult');
      if (toggle.checked && out){
        updateChineseFormat();
        el.style.display = 'block';
      }else{
        el.style.display = 'none';
      }
    }

    function updateChineseFormat(){
      const out = document.getElementById('resultInput').value;
      const dir = document.querySelector('input[name="convertDirection"]:checked').value;
      const el = document.getElementById('chineseFormatResult');
      if (!out) return (el.textContent = '');
      const num = parseFloat(out);
      el.textContent = (dir === 'twdToGame')
        ? `遊戲幣：${formatNumberToChinese(num)}`
        : `台幣：${num.toFixed(2)}`;
    }

    /* ========== 銀行交易計算器 ========== */
    function calculateBank(){
      const amount = parseFloat(document.getElementById('bankAmount').value);
      const type = document.getElementById('transactionType').value;
      const wed = document.getElementById('wednesdayDiscount').checked;

      if (isNaN(amount) || amount <= 0){
        alert('請輸入有效金額');
        return;
      }

      let fee = 0, finalAmount = amount, msg = '';

      switch(type){
        case 'cashDeposit':
          fee = Math.floor(amount * (wed ? 0.075 : 0.1));
          finalAmount = Math.floor(amount - fee);
          msg = `存入銀行需扣除手續費：${fee.toLocaleString()} 瑪幣，實際存入：${finalAmount.toLocaleString()} 瑪幣`;
          break;
        case 'cashWithdraw':
          msg = `從銀行提取現金無手續費，實際提取金額：${Math.floor(finalAmount).toLocaleString()} 瑪幣`;
          break;
        case 'checkIssue':
          fee = Math.floor(amount * (wed ? 0.0375 : 0.05));
          finalAmount = Math.floor(amount + fee);
          msg = `開立支票需支付手續費：${fee.toLocaleString()} 瑪幣，總支出：${finalAmount.toLocaleString()} 瑪幣`;
          break;
        case 'checkDeposit':
          msg = `支票存入銀行無手續費，實際存入金額：${Math.floor(finalAmount).toLocaleString()} 瑪幣`;
          break;
      }

      const box = document.getElementById('bankResult');
      box.textContent = msg;
      box.style.display = 'block';

      if (document.getElementById('bankChineseToggle').checked){
        updateBankChineseFormat();
        document.getElementById('bankChineseResult').style.display = 'block';
      } else {
        document.getElementById('bankChineseResult').style.display = 'none';
      }
    }

    function toggleBankChineseFormat(){
      const on = document.getElementById('bankChineseToggle').checked;
      const visible = document.getElementById('bankResult').style.display === 'block';
      const el = document.getElementById('bankChineseResult');
      if(on && visible){
        updateBankChineseFormat();
        el.style.display = 'block';
      }else{
        el.style.display = 'none';
      }
    }

    function updateBankChineseFormat(){
      const type = document.getElementById('transactionType').value;
      const amount = parseFloat(document.getElementById('bankAmount').value);
      const wed = document.getElementById('wednesdayDiscount').checked;

      let fee = 0, finalAmount = amount, message = '';

      switch(type){
        case 'cashDeposit':
          fee = Math.floor(amount * (wed ? 0.075 : 0.1));
          finalAmount = Math.floor(amount - fee);
          message = `手續費：${formatNumberToChinese(fee)} 瑪幣，實際存入：${formatNumberToChinese(finalAmount)} 瑪幣`;
          break;
        case 'cashWithdraw':
          message = `實際提取金額：${formatNumberToChinese(Math.floor(finalAmount))} 瑪幣`;
          break;
        case 'checkIssue':
          fee = Math.floor(amount * (wed ? 0.0375 : 0.05));
          finalAmount = Math.floor(amount + fee);
          message = `手續費：${formatNumberToChinese(fee)} 瑪幣，總支出：${formatNumberToChinese(finalAmount)} 瑪幣`;
          break;
        case 'checkDeposit':
          message = `實際存入金額：${formatNumberToChinese(Math.floor(finalAmount))} 瑪幣`;
          break;
      }
      document.getElementById('bankChineseResult').textContent = message;
    }

    /* ========== 拍賣手續費計算器 ========== */
    function calculateAuctionFee(){
      const amount = parseFloat(document.getElementById('auctionAmount').value);
      const includeCheck = document.getElementById('includeCheckFee').checked;

      if (isNaN(amount) || amount <= 0){
        alert('請輸入有效金額');
        return;
      }

      // 一般物品
      const normalAuctionFee = Math.floor(amount * 0.05);
      const afterNormalAuction = Math.floor(amount * 0.95);
      let normalFinal = afterNormalAuction;
      if (includeCheck){
        normalFinal = Math.floor(afterNormalAuction * 0.95);
      }

      // 生活服務物品
      const lifeAuctionFee = Math.floor(amount * 0.04);
      const afterLifeAuction = Math.floor(amount * 0.96);
      let lifeFinal = afterLifeAuction;
      if (includeCheck){
        lifeFinal = Math.floor(afterLifeAuction * 0.96);
      }

      const resultDiv = document.getElementById('auctionResult');
      let html = `
        <div class="section">
          <h2>一般物品</h2>
          <p>初始金額：<strong>${amount.toLocaleString()}</strong></p>
          <p>拍賣手續費（5%）後：
            <span class="formula">${amount.toLocaleString()} × 0.95 = ${afterNormalAuction.toLocaleString()}</span>
          </p>
          ${includeCheck ? `<p>支票手續費（5%）後：
            <span class="formula">${afterNormalAuction.toLocaleString()} × 0.95 = ${normalFinal.toLocaleString()}</span></p>` : ``}
          <p>最終金額：<span class="result-value">${normalFinal.toLocaleString()}</span></p>
        </div>
        <div class="section">
          <h2>生活服務物品</h2>
          <p>初始金額：<strong>${amount.toLocaleString()}</strong></p>
          <p>拍賣手續費（4%）後：
            <span class="formula">${amount.toLocaleString()} × 0.96 = ${afterLifeAuction.toLocaleString()}</span>
          </p>
          ${includeCheck ? `<p>支票手續費（4%）後：
            <span class="formula">${afterLifeAuction.toLocaleString()} × 0.96 = ${lifeFinal.toLocaleString()}</span></p>` : ``}
          <p>最終金額：<span class="result-value">${lifeFinal.toLocaleString()}</span></p>
        </div>
      `;
      resultDiv.innerHTML = html;
      resultDiv.style.display = 'block';

      if (document.getElementById('auctionChineseToggle').checked){
        updateAuctionChineseFormat();
        document.getElementById('auctionChineseResult').style.display = 'block';
      } else {
        document.getElementById('auctionChineseResult').style.display = 'none';
      }
    }

    function toggleAuctionChineseFormat(){
      const on = document.getElementById('auctionChineseToggle').checked;
      const visible = document.getElementById('auctionResult').style.display === 'block';
      const el = document.getElementById('auctionChineseResult');
      if (on && visible){
        updateAuctionChineseFormat();
        el.style.display = 'block';
      } else {
        el.style.display = 'none';
      }
    }

    function updateAuctionChineseFormat(){
      const amount = parseFloat(document.getElementById('auctionAmount').value);
      const includeCheck = document.getElementById('includeCheckFee').checked;

      const afterNormalAuction = Math.floor(amount * 0.95);
      const normalFinal = includeCheck ? Math.floor(afterNormalAuction * 0.95) : afterNormalAuction;

      const afterLifeAuction = Math.floor(amount * 0.96);
      const lifeFinal = includeCheck ? Math.floor(afterLifeAuction * 0.96) : afterLifeAuction;

      let text = `一般物品：${formatNumberToChinese(normalFinal)} 瑪幣\n`;
      text += `生活服務物品：${formatNumberToChinese(lifeFinal)} 瑪幣`;
      document.getElementById('auctionChineseResult').textContent = text;
    }

    /* 初始化 */
    updateConverterUI();
    checkThemePreference();
  </script>
</body>
</html>
